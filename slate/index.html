<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/slate/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Slate — fast, offline-first bookkeeping for busy shop counters.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Slate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Slate</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light;
      --slate-cream: #f8f7f2;
      --slate-ink: #1c1917;
      --slate-muted: #78716c;
      --slate-green: #16a34a;
      --slate-track: #d6d3d1;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--slate-cream);
    }

    #slate-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: var(--slate-cream);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 320ms ease, visibility 320ms ease;
    }

    #slate-loader.is-ready {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .slate-loader__content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slate-loader__mark {
      box-sizing: border-box;
      width: 72px;
      height: 72px;
      padding: 17px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      border-radius: 22px;
      background: var(--slate-green);
      box-shadow: 0 10px 24px rgba(22, 163, 74, 0.14);
      animation: slate-pulse 1.8s ease-in-out infinite;
    }

    .slate-loader__line {
      height: 3px;
      border-radius: 999px;
      background: #fff;
    }

    .slate-loader__line:nth-child(1) { width: 36px; }
    .slate-loader__line:nth-child(2) { width: 27px; }
    .slate-loader__line:nth-child(3) { width: 32px; }
    .slate-loader__line:nth-child(4) { width: 20px; }

    .slate-loader__title {
      margin-top: 24px;
      color: var(--slate-ink);
      font-size: 30px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: 5.5px;
    }

    .slate-loader__status {
      margin-top: 12px;
      color: var(--slate-muted);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .slate-loader__track {
      width: 132px;
      height: 3px;
      margin-top: 24px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--slate-track);
    }

    .slate-loader__bar {
      width: 44px;
      height: 100%;
      border-radius: inherit;
      background: var(--slate-green);
      animation: slate-progress 1.8s linear infinite;
    }

    @keyframes slate-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.018); }
    }

    @keyframes slate-progress {
      from { transform: translateX(-44px); }
      to { transform: translateX(132px); }
    }
  </style>
</head>
<body>
  <div id="slate-loader" role="status" aria-live="polite" aria-label="Slate is loading">
    <div class="slate-loader__content">
      <div class="slate-loader__mark" aria-hidden="true">
        <span class="slate-loader__line"></span>
        <span class="slate-loader__line"></span>
        <span class="slate-loader__line"></span>
        <span class="slate-loader__line"></span>
      </div>
      <div class="slate-loader__title">SLATE</div>
      <div class="slate-loader__status">Preparing your ledger</div>
      <div class="slate-loader__track" aria-hidden="true">
        <div class="slate-loader__bar"></div>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('slate-loader');
      if (!loader) return;
      loader.classList.add('is-ready');
      window.setTimeout(function () { loader.remove(); }, 350);
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
